<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla Estado de Resultados</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-dark: #004d4d;
            --bg-light: #e0ebeb;
            --bg-white: #ffffff;
            --text-color: #333333;
            --border-color: #d1e0e0;
            --sign-plus: #4caf50;
            --sign-minus: #f44336;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4f7f7;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .table-container {
            width: 100%;
            max-width: 700px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border-radius: 4px;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--bg-white);
        }

        th, td {
            padding: 16px 20px;
            font-size: 16px;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            line-height: 1.5;
        }

        /* Alineación y espaciado de las celdas */
        td:first-child {
            text-align: left;
            padding-left: 12%;
        }
        
        td:nth-child(2) {
            text-align: right;
            padding-right: 15%;
            white-space: nowrap;
        }

        /* Estilos de los Símbolos Matemáticos */
        .sign {
            font-weight: 700;
            margin-right: 4px;
            display: inline-block;
        }
        .plus { color: var(--sign-plus); }
        .minus { color: var(--sign-minus); }
        .equal { color: #000000; font-size: 17px; }

        /* Encabezado Principal */
        thead th {
            background-color: var(--primary-dark);
            color: var(--bg-white);
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 1px;
            text-align: center;
            font-size: 18px;
            padding: 18px;
        }

        /* Fila intercalada (Costos y Gastos) */
        .row-even {
            background-color: var(--bg-light);
        }

        /* Fila de Utilidad Neta (Texto ligeramente más destacado) */
        .row-total td:first-child {
            font-weight: 500;
        }

        /* --- ANIMACIONES CSS --- */

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Aplicar animación secuencial a las 3 filas */
        tbody tr {
            opacity: 0;
            animation: fadeInUp 0.4s ease-out forwards;
        }

        tbody tr:nth-child(1) { animation-delay: 0.1s; }
        tbody tr:nth-child(2) { animation-delay: 0.25s; }
        tbody tr:nth-child(3) { animation-delay: 0.4s; }

        /* Efecto Hover interactivo */
        tbody tr {
            transition: background-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
        }

        tbody tr:hover {
            background-color: rgba(0, 77, 77, 0.04) !important;
            transform: scale(1.005);
            box-shadow: 0 4px 10px rgba(0,0,0,0.06);
            z-index: 10;
            position: center;
            cursor: default;
        }
    </style>
</head>
<body>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th colspan="2">Estados de Resultados</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><span class="sign plus">(+)</span> Ingresos</td>
                    <td>$ 35.000.000</td>
                </tr>
                <tr class="row-even">
                    <td><span class="sign minus">(-)</span> Costos y Gastos</td>
                    <td>($ 22.000.000)</td>
                </tr>
                <tr class="row-total">
                    <td><span class="sign equal">(=)</span> Utilidad Neta</td>
                    <td>$ 13.000.000</td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
