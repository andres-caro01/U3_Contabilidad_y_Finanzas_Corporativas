<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Margen Bruto % - Glassmorphism & Liquid Edition</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    
    <style>
        :root {
            --primary-base: #054C50;
            --primary-glow: #0cd1dc;
            --glass-bg: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #091617;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            padding: 15px;
        }

        /* Esferas de fondo estilo líquido/orgánico */
        .bg-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 1;
            animation: float 12s infinite ease-in-out;
        }

        .blob-1 { width: 400px; height: 400px; background: linear-gradient(135deg, var(--primary-base), #0a3336); top: -10%; left: -10%; }
        .blob-2 { width: 450px; height: 450px; background: linear-gradient(135deg, #0d5e63, var(--primary-glow)); bottom: -15%; right: -10%; animation-delay: -3s; }
        .blob-3 { width: 280px; height: 280px; background: linear-gradient(135deg, #032b2e, #13858c); top: 40%; left: 50%; animation-delay: -6s; }

        /* Tarjeta Contenedora Principal (Glassmorphism) */
        .glass-card {
            position: relative;
            z-index: 10;
            background: var(--glass-bg);
            backdrop-filter: blur(25px) saturate(160%);
            -webkit-backdrop-filter: blur(25px) saturate(160%);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: clamp(20px, 4vw, 45px) clamp(15px, 3vw, 35px);
            width: 100%;
            max-width: 850px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            
            opacity: 0;
            transform: translateY(20px) scale(0.98);
            animation: cardEntrance 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Contenedor de la Fórmula - Ampliado para contener textos fraccionarios largos */
        .formula-wrapper {
            position: relative;
            background: rgba(4, 18, 19, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 18px;
            padding: 45px 20px;
            margin-bottom: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            overflow: hidden;
            
            opacity: 0;
            animation: fadeIn 0.5s ease 0.2s forwards;
        }

        .formula-wrapper:hover {
            transform: translateY(-2px);
            border-color: rgba(12, 209, 220, 0.25);
            box-shadow: 0 10px 20px rgba(5, 76, 80, 0.3);
        }

        /* Contenedor matemático */
        .math-container {
            width: 100%;
            max-width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Tipografía responsiva calibrada para fracciones extendidas */
        .katex-display {
            margin: 0 !important;
            color: #e0f2f1;
            text-shadow: 0 0 15px rgba(12, 209, 220, 0.15);
            font-size: clamp(0.85rem, 2.6vw, 1.55rem) !important;
            white-space: normal; 
            word-break: break-word;
        }

        .katex-display > .katex {
            white-space: normal;
            display: inline-block;
            text-align: center;
        }
        
        .formula-wrapper:active .katex-display {
            transform: scale(0.99);
        }

        /* Botón Futurista Líquido */
        .btn-liquid {
            position: relative;
            background: linear-gradient(135deg, var(--primary-base), #09393c);
            color: #ffffff;
            border: none;
            padding: 14px 32px;
            font-size: clamp(0.85rem, 1.8vw, 0.95rem);
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-radius: 14px;
            cursor: pointer;
            outline: none;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(5, 76, 80, 0.4);
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            
            opacity: 0;
            animation: fadeIn 0.5s ease 0.4s forwards;
        }

        .btn-liquid::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(12, 209, 220, 0.2), transparent);
            transition: all 0.5s ease;
        }

        .btn-liquid:hover {
            background: linear-gradient(135deg, #075c61, var(--primary-base));
            box-shadow: 0 10px 24px rgba(12, 209, 220, 0.25);
            transform: translateY(-1px);
        }

        .btn-liquid:hover::before { left: 100%; }

        .hint-text {
            font-size: clamp(0.75rem, 1.8vw, 0.85rem);
            color: rgba(224, 242, 241, 0.35);
            margin-top: 15px;
            letter-spacing: 0.5px;
            opacity: 0;
            animation: fadeIn 0.5s ease 0.5s forwards;
        }

        /* Toast Notificación */
        .toast {
            position: absolute;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(12, 209, 220, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(12, 209, 220, 0.3);
            color: #ffffff;
            padding: 10px 24px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 500;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0;
            z-index: 100;
            white-space: nowrap;
        }

        .toast.show {
            bottom: 25px;
            opacity: 1;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-15px) scale(1.02); }
        }

        @keyframes cardEntrance { to { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes fadeIn { to { opacity: 1; } }

        @media (max-width: 480px) {
            .formula-wrapper {
                padding: 30px 10px;
            }
            .btn-liquid {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>
    <div class="bg-blob blob-3"></div>

    <div class="glass-card">
        
        <div class="formula-wrapper" id="formulaContainer" title="Haz clic para copiar el código LaTeX">
            <div class="math-container" id="mathTarget"></div>
        </div>

        <button class="btn-liquid" id="copyAction">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            Copiar Código LaTeX
        </button>

        <div class="hint-text">Interactivo: Haz clic en la fórmula o en el botón para copiar</div>
        
        <div class="toast" id="copyNotification">✨ ¡Copiado en el portapapeles!</div>
    </div>

    <script>
        // Transcripción exacta en formato LaTeX estructurado con entorno de texto plano
        const latexValue = "\\text{Margen bruto \\%}: \\frac{\\text{Ganancia bruta}}{\\text{Ingresos de actividades ordinarias}}";

        document.addEventListener("DOMContentLoaded", function() {
            const container = document.getElementById('mathTarget');
            if (typeof katex !== 'undefined') {
                katex.render(latexValue, container, {
                    throwOnError: false,
                    displayMode: true
                });
            } else {
                container.innerHTML = `<span style="color:#fff">${latexValue}</span>`;
            }
        });

        function ejecutarCopia() {
            navigator.clipboard.writeText(latexValue).then(() => {
                const toast = document.getElementById('copyNotification');
                toast.classList.add('show');
                
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 2000);
            }).catch(err => {
                console.error('No se pudo copiar: ', err);
            });
        }

        document.getElementById('copyAction').addEventListener('click', ejecutarCopia);
        document.getElementById('formulaContainer').addEventListener('click', ejecutarCopia);
    </script>

</body>
</html>
