<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fórmula de Depreciación - Glassmorphism & Liquid Edition</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    
    <style>
        :root {
            --primary-base: #054C50;
            --primary-glow: #0cd1dc;
            --liquid-color-1: rgba(5, 76, 80, 0.8);
            --liquid-color-2: rgba(12, 209, 220, 0.4);
            --glass-bg: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #091617;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Esferas de fondo estilo líquido/orgánico */
        .bg-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 1;
            animation: float 12s infinite ease-in-out;
        }

        .blob-1 {
            width: 450px;
            height: 450px;
            background: linear-gradient(135deg, var(--primary-base), #0a3336);
            top: -10%;
            left: -10%;
            animation-delay: 0s;
        }

        .blob-2 {
            width: 500px;
            height: 500px;
            background: linear-gradient(135deg, #0d5e63, var(--primary-glow));
            bottom: -15%;
            right: -10%;
            animation-delay: -3s;
        }

        .blob-3 {
            width: 300px;
            height: 300px;
            background: linear-gradient(135deg, #032b2e, #13858c);
            top: 40%;
            left: 50%;
            animation-delay: -6s;
        }

        /* Tarjeta Contenedora Principal (Glassmorphism) */
        .glass-card {
            position: relative;
            z-index: 10;
            background: var(--glass-bg);
            backdrop-filter: blur(25px) saturate(160%);
            -webkit-backdrop-filter: blur(25px) saturate(160%);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 50px 40px;
            width: 850px;
            max-width: 92%;
            box-shadow: 
                0 25px 50px -12px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.2),
                inset 0 -1px 0 rgba(0, 0, 0, 0.3);
            text-align: center;
            
            /* Animación de entrada de la tarjeta */
            opacity: 0;
            transform: translateY(40px) scale(0.95);
            animation: cardEntrance 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Efecto de Brillo de Cristal en los Bordes */
        .glass-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 32px;
            padding: 2px;
            background: linear-gradient(135deg, rgba(255,255,255,0.3), rgba(255,255,255,0.05) 40%, rgba(5,76,80,0) 60%, rgba(12,209,220,0.2));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        /* SOLUCIÓN AL DESBORDAMIENTO: Contenedor con scroll integrado y auto-ajuste */
        .formula-wrapper {
            position: relative;
            background: rgba(4, 18, 19, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 40px 24px;
            margin-bottom: 35px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            
            /* Permite scroll horizontal si la pantalla es excesivamente pequeña */
            overflow-x: auto;
            overflow-y: hidden;
            display: flex;
            justify-content: center;
            align-items: center;

            /* Barra de scroll oculta o minimalista */
            scrollbar-width: thin;
            scrollbar-color: rgba(12, 209, 220, 0.2) transparent;

            /* Animación de entrada */
            opacity: 0;
            animation: fadeIn 0.8s ease 0.4s forwards;
        }

        /* Estilos de la barra de scroll para Webkit (Chrome/Safari) */
        .formula-wrapper::-webkit-scrollbar {
            height: 4px;
        }
        .formula-wrapper::-webkit-scrollbar-thumb {
            background: rgba(12, 209, 220, 0.25);
            border-radius: 10px;
        }

        /* Simulación de reflejos líquidos fluidos */
        .formula-wrapper::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%; right: -50%; bottom: -50%;
            background: radial-gradient(circle, rgba(12, 209, 220, 0.08) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.6s ease;
            pointer-events: none;
        }

        .formula-wrapper:hover {
            transform: translateY(-4px);
            border-color: rgba(12, 209, 220, 0.3);
            box-shadow: 0 15px 30px rgba(5, 76, 80, 0.25);
        }

        .formula-wrapper:hover::after {
            opacity: 1;
        }

        /* Ajuste de escala responsiva para evitar cortes */
        .katex-display {
            margin: 0 !important;
            color: #e0f2f1;
            text-shadow: 0 0 15px rgba(12, 209, 220, 0.2);
            font-size: 1.7rem; /* Reducido un toque para asegurar el fit estándar */
            transition: transform 0.3s ease;
            white-space: nowrap; /* Evita saltos de línea caóticos */
            display: inline-block;
        }
        
        .formula-wrapper:active .katex-display {
            transform: scale(0.98);
        }

        /* Botón Futurista Líquido */
        .btn-liquid {
            position: relative;
            background: linear-gradient(135deg, var(--primary-base), #09393c);
            color: #ffffff;
            border: none;
            padding: 16px 36px;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-radius: 16px;
            cursor: pointer;
            outline: none;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(5, 76, 80, 0.4);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: inline-flex;
            align-items: center;
            gap: 12px;
            
            /* Animación de entrada */
            opacity: 0;
            animation: fadeIn 0.8s ease 0.7s forwards;
        }

        /* Capa líquida interna animada del botón al pasar el mouse */
        .btn-liquid::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(12, 209, 220, 0.25), transparent);
            transition: all 0.6s ease;
        }

        .btn-liquid:hover {
            background: linear-gradient(135deg, #075c61, var(--primary-base));
            box-shadow: 0 12px 28px rgba(12, 209, 220, 0.3);
            transform: translateY(-2px);
        }

        .btn-liquid:hover::before {
            left: 100%;
        }

        .btn-liquid:active {
            transform: translateY(1px);
            box-shadow: 0 4px 12px rgba(5, 76, 80, 0.3);
        }

        /* Indicador sutil debajo de la interfaz */
        .hint-text {
            font-size: 0.85rem;
            color: rgba(224, 242, 241, 0.4);
            margin-top: 15px;
            letter-spacing: 0.5px;
            opacity: 0;
            animation: fadeIn 0.8s ease 0.9s forwards;
        }

        /* Toast Notificación con desenfoque de cristal */
        .toast {
            position: absolute;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(12, 209, 220, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(12, 209, 220, 0.3);
            color: #ffffff;
            padding: 12px 28px;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 500;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            pointer-events: none;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0;
            z-index: 100;
        }

        .toast.show {
            bottom: 30px;
            opacity: 1;
        }

        /* Animación para los círculos de fondo líquido */
        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1) rotate(0deg); }
            33% { transform: translateY(-30px) scale(1.05) rotate(120deg); }
            66% { transform: translateY(20px) scale(0.95) rotate(240deg); }
        }

        /* Animaciones del contenedor */
        @keyframes cardEntrance {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        /* Ajustes Dinámicos de Pantalla para evitar desbordamiento */
        @media (max-width: 800px) {
            .katex-display {
                font-size: 1.4rem;
            }
        }
        @media (max-width: 650px) {
            .glass-card {
                padding: 35px 20px;
            }
            .katex-display {
                font-size: 1.15rem;
            }
            .formula-wrapper {
                padding: 30px 12px;
                justify-content: flex-start; /* Permite un deslizamiento natural en móviles */
            }
        }
    </style>
</head>
<body>

    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>
    <div class="bg-blob blob-3"></div>

    <div class="glass-card">
        
        <div class="formula-wrapper" id="formulaContainer" title="Haz clic en cualquier parte para copiar el código LaTeX">
            <div id="mathTarget"></div>
        </div>

        <button class="btn-liquid" id="copyAction">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            Copiar Código LaTeX
        </button>

        <div class="hint-text">Interactivo: Haz clic en la fórmula o en el botón para copiar</div>
        
        <div class="toast" id="copyNotification">✨ ¡Copiado en el portapapeles!</div>
    </div>

    <script>
        const latexValue = "\\text{Depreciación anual} = \\frac{\\$ \\, 100.000.000}{10} = \\$ \\, 10.000.000";

        document.addEventListener("DOMContentLoaded", function() {
            const container = document.getElementById('mathTarget');
            if (typeof katex !== 'undefined') {
                katex.render(latexValue, container, {
                    throwOnError: false,
                    displayMode: true
                });
            } else {
                container.innerHTML = `<span style="color:#fff">${latexValue}</span>`;
            }
        });

        function ejecutarCopia() {
            navigator.clipboard.writeText(latexValue).then(() => {
                const toast = document.getElementById('copyNotification');
                toast.classList.add('show');
                
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 2000);
            }).catch(err => {
                console.error('No se pudo copiar el elemento matemático: ', err);
            });
        }

        document.getElementById('copyAction').addEventListener('click', ejecutarCopia);
        document.getElementById('formulaContainer').addEventListener('click', ejecutarCopia);
    </script>

</body>
</html>
